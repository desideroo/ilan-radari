name: probe (faz 0)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Detail probe
        run: python probe/probe_detail.py
      - name: Publish results to probe-results branch
        run: |
          mkdir -p /tmp/pub && cp -r probe_out/* /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf . >/dev/null
          cp -r /tmp/pub/* .
          git add -A
          git commit -m "probe results $(date -u +%FT%TZ)"
          git push -f origin probe-results
